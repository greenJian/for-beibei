<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6EEF8"/>
      <stop offset="60%" stop-color="#A8D8EA"/>
      <stop offset="100%" stop-color="#89CFF0"/>
    </linearGradient>
    <linearGradient id="shell" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#FFE8D6"/>
      <stop offset="30%" stop-color="#FFD4C4"/>
      <stop offset="70%" stop-color="#FFC3A0"/>
      <stop offset="100%" stop-color="#FFB5A7"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8C4"/>
      <stop offset="100%" stop-color="#FFF0D4"/>
    </linearGradient>
  </defs>

  <!-- Sky/ocean background -->
  <rect width="32" height="32" rx="6" fill="url(#sky)"/>

  <!-- Sandy beach bottom -->
  <rect x="0" y="22" width="32" height="10" rx="6" fill="url(#sand)"/>
  <!-- Gentle wave line -->
  <path d="M0,22 Q8,19 16,22 Q24,25 32,22" stroke="#89CFF0" stroke-width="0.8" fill="#A8D8EA" opacity="0.6"/>

  <!-- Scallop shell -->
  <g transform="translate(16, 15)">
    <path d="M-6,3 C-7,-2 -5,-6 -2.5,-8.5 C-1,-10 0,-10.5 0,-10.5 C0,-10.5 1,-10 2.5,-8.5 C5,-6 7,-2 6,3 C5,0 2.5,-2 0,-2.5 C-2.5,-2 -5,0 -6,3Z"
          fill="url(#shell)"/>
    <!-- Shell ridges -->
    <line x1="0" y1="-10" x2="0" y2="2" stroke="rgba(255,255,255,0.5)" stroke-width="0.6"/>
    <line x1="-3" y1="-8.5" x2="-2" y2="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="0.4"/>
    <line x1="3" y1="-8.5" x2="2" y2="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="0.4"/>
    <!-- Bottom edge -->
    <path d="M-5.5,3.5 C-3.5,5.5 3.5,5.5 5.5,3.5" stroke="rgba(255,255,255,0.6)" stroke-width="0.7" fill="none"/>
  </g>

  <!-- Tiny heart -->
  <g transform="translate(16, 16)">
    <path d="M0,1.5 C-0.8,0 -2.2,0 -2.2,-1.5 C-2.2,-2.8 -1.2,-3.5 0,-2.3 C1.2,-3.5 2.2,-2.8 2.2,-1.5 C2.2,0 0.8,0 0,1.5Z"
          fill="#FF8FAB" opacity="0.85"/>
  </g>

  <!-- Shimmer dot -->
  <circle cx="13" cy="9" r="0.8" fill="rgba(255,255,255,0.7)"/>
</svg>
