<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky gradient: very light blue to soft blue -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF6FC"/>
      <stop offset="30%" stop-color="#D6EEF8"/>
      <stop offset="60%" stop-color="#B8E2F2"/>
      <stop offset="100%" stop-color="#A8D8EA"/>
    </linearGradient>

    <!-- Ocean gradient -->
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89CFF0"/>
      <stop offset="30%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#6BB5D0"/>
    </linearGradient>

    <!-- Sandy beach -->
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CA"/>
      <stop offset="40%" stop-color="#FDE8C4"/>
      <stop offset="100%" stop-color="#FFF0D4"/>
    </linearGradient>

    <!-- Shell gradient: pink-gold -->
    <linearGradient id="shellBody" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#FFF0E0"/>
      <stop offset="20%" stop-color="#FFE4D0"/>
      <stop offset="45%" stop-color="#FFD4C4"/>
      <stop offset="70%" stop-color="#FFC3A0"/>
      <stop offset="100%" stop-color="#FFB5A7"/>
    </linearGradient>

    <!-- Shell golden shimmer overlay -->
    <linearGradient id="shellShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,215,0,0.12)"/>
      <stop offset="50%" stop-color="rgba(255,215,0,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,215,0,0.08)"/>
    </linearGradient>

    <!-- Heart gradient -->
    <linearGradient id="heart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB8C6"/>
      <stop offset="50%" stop-color="#FF8FAB"/>
      <stop offset="100%" stop-color="#FF7B95"/>
    </linearGradient>

    <!-- Text color -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4956A"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#B8865E"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="shellGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===== SCENE BACKGROUND ===== -->

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Ocean -->
  <rect x="0" y="300" width="512" height="100" fill="url(#ocean)"/>

  <!-- Gentle waves (ocean surface lines) -->
  <g opacity="0.35">
    <path d="M0,315 Q50,305 100,315 Q150,325 200,315 Q250,305 300,315 Q350,325 400,315 Q450,305 512,315"
          stroke="#A8D8EA" stroke-width="1.5" fill="none"/>
    <path d="M0,335 Q60,325 120,335 Q180,345 240,335 Q300,325 360,335 Q420,345 480,335 Q510,330 512,335"
          stroke="#A8D8EA" stroke-width="1.2" fill="none"/>
    <path d="M0,360 Q40,352 80,360 Q120,368 160,360 Q200,352 240,360 Q280,368 320,360 Q360,352 400,360 Q440,368 480,360 Q500,356 512,360"
          stroke="#A8D8EA" stroke-width="1" fill="none"/>
    <path d="M0,380 Q70,372 140,380 Q210,388 280,380 Q350,372 420,380 Q470,386 512,380"
          stroke="#B8E2F2" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Sandy beach -->
  <rect x="0" y="395" width="512" height="117" fill="url(#sand)"/>

  <!-- Beach dots (sand texture) -->
  <g opacity="0.15">
    <circle cx="60" cy="420" r="1.2" fill="#D4A574"/>
    <circle cx="150" cy="430" r="1" fill="#D4A574"/>
    <circle cx="240" cy="415" r="1.3" fill="#D4A574"/>
    <circle cx="340" cy="440" r="1" fill="#D4A574"/>
    <circle cx="420" cy="418" r="1.2" fill="#D4A574"/>
    <circle cx="110" cy="450" r="0.8" fill="#D4A574"/>
    <circle cx="280" cy="455" r="1" fill="#D4A574"/>
    <circle cx="380" cy="445" r="0.9" fill="#D4A574"/>
    <circle cx="460" cy="435" r="1.1" fill="#D4A574"/>
  </g>

  <!-- ===== SHELL ===== -->
  <g transform="translate(256, 310)" filter="url(#shellGlow)">
    <!-- Shell body -->
    <path d="
      M-95,30
      C-100,-30 -72,-85 -38,-120
      C-16,-142 0,-155 0,-155
      C0,-155 16,-142 38,-120
      C72,-85 100,-30 95,30
      C90,0 62,-35 0,-48
      C-62,-35 -90,0 -95,30Z"
          fill="url(#shellBody)"/>

    <!-- Golden shimmer overlay -->
    <path d="
      M-95,30
      C-100,-30 -72,-85 -38,-120
      C-16,-142 0,-155 0,-155
      C0,-155 16,-142 38,-120
      C72,-85 100,-30 95,30
      C90,0 62,-35 0,-48
      C-62,-35 -90,0 -95,30Z"
          fill="url(#shellShimmer)"/>

    <!-- Shell ridges -->
    <line x1="0" y1="-148" x2="0" y2="-42" stroke="rgba(255,255,255,0.55)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="-17" y1="-143" x2="-12" y2="-43" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="17" y1="-143" x2="12" y2="-43" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-35" y1="-133" x2="-25" y2="-43" stroke="rgba(255,255,255,0.32)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="35" y1="-133" x2="25" y2="-43" stroke="rgba(255,255,255,0.32)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-55" y1="-115" x2="-40" y2="-40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="55" y1="-115" x2="40" y2="-40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-73" y1="-90" x2="-52" y2="-33" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="73" y1="-90" x2="52" y2="-33" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Shell bottom arc -->
    <path d="M-82,35 C-55,60 55,60 82,35"
          stroke="rgba(255,255,255,0.55)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Shell inner highlight arc -->
    <path d="M-65,42 C-45,58 45,58 65,42"
          stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>

    <!-- Shell shimmer sparkle -->
    <circle cx="-30" cy="-100" r="3" fill="rgba(255,255,255,0.6)" filter="url(#softGlow)"/>
    <circle cx="40" cy="-85" r="2" fill="rgba(255,255,255,0.5)" filter="url(#softGlow)"/>
    <circle cx="-15" cy="-130" r="2.5" fill="rgba(255,255,255,0.55)" filter="url(#softGlow)"/>
    <circle cx="10" cy="-120" r="1.8" fill="rgba(255,215,0,0.45)" filter="url(#softGlow)"/>
  </g>

  <!-- Heart inside shell -->
  <g transform="translate(256, 320)" filter="url(#softGlow)">
    <path d="M0,12 C-7,0 -26,0 -26,-12 C-26,-24 -15,-32 0,-22 C15,-32 26,-24 26,-12 C26,0 7,0 0,12Z"
          fill="url(#heart)"/>
    <!-- Heart highlight -->
    <path d="M-8,-18 C-13,-15 -10,-10 -5,-7" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== DECORATIVE ELEMENTS ===== -->

  <!-- Tiny clouds -->
  <g opacity="0.3">
    <ellipse cx="100" cy="100" rx="35" ry="12" fill="white"/>
    <ellipse cx="120" cy="95" rx="25" ry="10" fill="white"/>
    <ellipse cx="85" cy="96" rx="20" ry="8" fill="white"/>

    <ellipse cx="400" cy="70" rx="30" ry="10" fill="white"/>
    <ellipse cx="420" cy="66" rx="22" ry="8" fill="white"/>
    <ellipse cx="385" cy="67" rx="18" ry="7" fill="white"/>
  </g>

  <!-- Seagulls -->
  <g opacity="0.25" stroke="#7EC8E3" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M140,140 Q148,132 156,140"/>
    <path d="M360,160 Q368,152 376,160"/>
    <path d="M170,165 Q175,159 180,165"/>
  </g>

  <!-- Shell on sand (small decorative seashells) -->
  <g opacity="0.2">
    <path d="M130,430 Q135,422 140,430 Q135,434 130,430Z" fill="#D4A574"/>
    <path d="M370,450 Q374,444 378,450 Q374,453 370,450Z" fill="#D4A574"/>
  </g>

  <!-- ===== TEXT ===== -->
  <text x="256" y="478" text-anchor="middle" fill="url(#textGrad)"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="30" font-weight="600" letter-spacing="6">
    For Beibei
  </text>
</svg>
