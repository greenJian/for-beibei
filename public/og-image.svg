<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF6FC"/>
      <stop offset="30%" stop-color="#D6EEF8"/>
      <stop offset="65%" stop-color="#B8E2F2"/>
      <stop offset="100%" stop-color="#A8D8EA"/>
    </linearGradient>

    <!-- Ocean -->
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89CFF0"/>
      <stop offset="50%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#6BB5D0"/>
    </linearGradient>

    <!-- Sand -->
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CA"/>
      <stop offset="50%" stop-color="#FDE8C4"/>
      <stop offset="100%" stop-color="#FFF0D4"/>
    </linearGradient>

    <!-- Shell: pink-gold -->
    <linearGradient id="shellBody" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#FFF0E0"/>
      <stop offset="20%" stop-color="#FFE4D0"/>
      <stop offset="45%" stop-color="#FFD4C4"/>
      <stop offset="70%" stop-color="#FFC3A0"/>
      <stop offset="100%" stop-color="#FFB5A7"/>
    </linearGradient>

    <linearGradient id="shellShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,215,0,0.12)"/>
      <stop offset="50%" stop-color="rgba(255,215,0,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,215,0,0.08)"/>
    </linearGradient>

    <!-- Heart -->
    <linearGradient id="heart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB8C6"/>
      <stop offset="50%" stop-color="#FF8FAB"/>
      <stop offset="100%" stop-color="#FF7B95"/>
    </linearGradient>

    <!-- Text: warm sand/brown -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4956A"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#B8865E"/>
    </linearGradient>

    <!-- Sub text -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(137,207,240,0.8)"/>
      <stop offset="100%" stop-color="rgba(126,200,227,0.5)"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Ocean -->
  <rect x="0" y="360" width="1200" height="120" fill="url(#ocean)"/>

  <!-- Waves -->
  <g opacity="0.3">
    <path d="M0,375 Q80,362 160,375 Q240,388 320,375 Q400,362 480,375 Q560,388 640,375 Q720,362 800,375 Q880,388 960,375 Q1040,362 1120,375 Q1160,381 1200,375"
          stroke="#A8D8EA" stroke-width="2" fill="none"/>
    <path d="M0,400 Q50,392 100,400 Q150,408 200,400 Q250,392 300,400 Q350,408 400,400 Q450,392 500,400 Q550,408 600,400 Q650,392 700,400 Q750,408 800,400 Q850,392 900,400 Q950,408 1000,400 Q1050,392 1100,400 Q1150,408 1200,400"
          stroke="#A8D8EA" stroke-width="1.5" fill="none"/>
    <path d="M0,430 Q100,418 200,430 Q300,442 400,430 Q500,418 600,430 Q700,442 800,430 Q900,418 1000,430 Q1100,442 1200,430"
          stroke="#B8E2F2" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Sandy beach -->
  <rect x="0" y="475" width="1200" height="155" fill="url(#sand)"/>

  <!-- Sand texture dots -->
  <g opacity="0.12">
    <circle cx="80" cy="500" r="1.5" fill="#D4A574"/>
    <circle cx="250" cy="510" r="1.2" fill="#D4A574"/>
    <circle cx="380" cy="495" r="1.4" fill="#D4A574"/>
    <circle cx="520" cy="520" r="1.3" fill="#D4A574"/>
    <circle cx="680" cy="498" r="1.5" fill="#D4A574"/>
    <circle cx="800" cy="515" r="1.1" fill="#D4A574"/>
    <circle cx="950" cy="505" r="1.4" fill="#D4A574"/>
    <circle cx="1080" cy="520" r="1.2" fill="#D4A574"/>
    <circle cx="150" cy="545" r="1" fill="#D4A574"/>
    <circle cx="450" cy="550" r="1.1" fill="#D4A574"/>
    <circle cx="750" cy="540" r="1.3" fill="#D4A574"/>
    <circle cx="1020" cy="555" r="1" fill="#D4A574"/>
  </g>

  <!-- Clouds -->
  <g opacity="0.25">
    <ellipse cx="200" cy="120" rx="50" ry="16" fill="white"/>
    <ellipse cx="230" cy="114" rx="35" ry="13" fill="white"/>
    <ellipse cx="175" cy="115" rx="28" ry="10" fill="white"/>

    <ellipse cx="900" cy="80" rx="45" ry="14" fill="white"/>
    <ellipse cx="930" cy="74" rx="30" ry="11" fill="white"/>
    <ellipse cx="880" cy="75" rx="25" ry="9" fill="white"/>
  </g>

  <!-- Seagulls -->
  <g opacity="0.2" stroke="#7EC8E3" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M280,160 Q290,150 300,160"/>
    <path d="M750,180 Q760,170 770,180"/>
    <path d="M310,195 Q316,188 322,195"/>
  </g>

  <!-- ===== SHELL (left side) ===== -->
  <g transform="translate(370, 370)" filter="url(#softGlow)">
    <!-- Shell body -->
    <path d="
      M-135,40
      C-142,-42 -102,-120 -54,-170
      C-23,-200 0,-220 0,-220
      C0,-220 23,-200 54,-170
      C102,-120 142,-42 135,40
      C128,0 88,-50 0,-68
      C-88,-50 -128,0 -135,40Z"
          fill="url(#shellBody)"/>

    <path d="
      M-135,40
      C-142,-42 -102,-120 -54,-170
      C-23,-200 0,-220 0,-220
      C0,-220 23,-200 54,-170
      C102,-120 142,-42 135,40
      C128,0 88,-50 0,-68
      C-88,-50 -128,0 -135,40Z"
          fill="url(#shellShimmer)"/>

    <!-- Shell ridges -->
    <line x1="0" y1="-210" x2="0" y2="-60" stroke="rgba(255,255,255,0.55)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-24" y1="-202" x2="-17" y2="-60" stroke="rgba(255,255,255,0.4)" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="24" y1="-202" x2="17" y2="-60" stroke="rgba(255,255,255,0.4)" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="-50" y1="-188" x2="-36" y2="-60" stroke="rgba(255,255,255,0.3)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="50" y1="-188" x2="36" y2="-60" stroke="rgba(255,255,255,0.3)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-78" y1="-162" x2="-56" y2="-55" stroke="rgba(255,255,255,0.22)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="78" y1="-162" x2="56" y2="-55" stroke="rgba(255,255,255,0.22)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-105" y1="-125" x2="-74" y2="-45" stroke="rgba(255,255,255,0.15)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="-125" x2="74" y2="-45" stroke="rgba(255,255,255,0.15)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Bottom arc -->
    <path d="M-116,50 C-78,85 78,85 116,50"
          stroke="rgba(255,255,255,0.55)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-92,60 C-62,82 62,82 92,60"
          stroke="rgba(255,255,255,0.3)" stroke-width="2.5" fill="none"/>

    <!-- Shimmer sparkles -->
    <circle cx="-40" cy="-140" r="4.5" fill="rgba(255,255,255,0.6)" filter="url(#softGlow)"/>
    <circle cx="55" cy="-120" r="3" fill="rgba(255,255,255,0.5)" filter="url(#softGlow)"/>
    <circle cx="-20" cy="-185" r="3.5" fill="rgba(255,255,255,0.5)" filter="url(#softGlow)"/>
    <circle cx="15" cy="-170" r="2.5" fill="rgba(255,215,0,0.45)" filter="url(#softGlow)"/>
    <circle cx="-70" cy="-100" r="2.5" fill="rgba(255,215,0,0.35)" filter="url(#softGlow)"/>
  </g>

  <!-- Heart -->
  <g transform="translate(370, 385)" filter="url(#softGlow)">
    <path d="M0,17 C-10,0 -38,0 -38,-17 C-38,-34 -22,-45 0,-31 C22,-45 38,-34 38,-17 C38,0 10,0 0,17Z"
          fill="url(#heart)"/>
    <path d="M-12,-25 C-18,-22 -14,-14 -7,-10" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== TEXT AREA (right side) ===== -->
  <g transform="translate(720, 280)">
    <!-- Main title -->
    <text x="0" y="0" text-anchor="start" fill="url(#titleGrad)"
          font-family="Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif"
          font-size="68" font-weight="bold" letter-spacing="6">
      For Beibei
    </text>

    <!-- Slogan -->
    <text x="0" y="65" text-anchor="start" fill="#FF8FAB"
          font-family="'PingFang SC','Hiragino Sans GB','STKaiti','KaiTi','Microsoft YaHei',sans-serif"
          font-size="24" font-weight="400" letter-spacing="6">
      记录我们走过的每一步
    </text>

    <!-- Decorative line -->
    <line x1="0" y1="95" x2="320" y2="95" stroke="rgba(255,143,171,0.25)" stroke-width="1"/>
  </g>

  <!-- Small decorative shells -->
  <g opacity="0.15">
    <path d="M800,500 Q806,492 812,500 Q806,504 800,500Z" fill="#D4A574"/>
    <path d="M1000,515 Q1005,509 1010,515 Q1005,518 1000,515Z" fill="#D4A574"/>
  </g>
</svg>
